  <!-- Stops your site being embedded in iframes (clickjacking attack) -->
  <meta http-equiv="X-Frame-Options" content="DENY">

  <!-- Blocks XSS attacks by controlling what scripts can run -->

        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">

  <!-- Prevents browser guessing file types (MIME sniffing attack) -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">

  <!-- Controls what info is sent when clicking links to other sites -->
  <meta http-equiv="Referrer-Policy" content="no-referrer">

  <!-- Blocks dangerous browser features from being used on your page -->
  <meta http-equiv="Permissions-Policy"
